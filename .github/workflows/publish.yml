name: Publish Packages

on:
  push:
    tags:
      - "v*" # v0.1.0, v1.8.1, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@premast"
          cache: "pnpm"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # Take the version from the tag so the released artifacts match
      # what the tag promises. `sync-versions.js <version>` rewrites
      # every package.json to the tag version; the `--fix` behaviour
      # is implied when a version argument is passed.
      - name: Sync package versions to tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing version: $VERSION"
          node scripts/sync-versions.js "$VERSION"

      - name: Build CLI (copy starter template)
        run: pnpm build:cli

      # `pnpm -r publish` picks up every workspace member that isn't
      # `"private": true`, so adding a new @premast package only
      # requires registering it in scripts/sync-versions.js — no
      # workflow change needed. --no-git-checks skips the pre-publish
      # clean-tree requirement (we just mutated package.json versions).
      #
      # Auth: GITHUB_TOKEN can only write to packages *linked to this
      # repository*. The plugin packages were first published by hand and
      # aren't linked, so under GITHUB_TOKEN they 403 with
      # `permission_denied: write_package` — which silently dropped every
      # plugin from v1.8.2, v1.9.0 and v1.10.0 while site-core published
      # fine. Set the NPM_PUBLISH_TOKEN secret (a PAT with
      # `write:packages`) to avoid that; it falls back to GITHUB_TOKEN so
      # a fork without the secret still behaves as before.
      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm -r publish --no-git-checks --access restricted

      # `pnpm -r publish` stops at the first failure, so a single
      # unpublishable package hides every one after it — that's how the
      # symbols plugin, the headline of v1.10.0, ended up unpublished
      # while the release looked tagged and done. Verify explicitly.
      - name: Verify every package published at the tag version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          FAILED=0
          for DIR in $(node -e "
            const {readdirSync,existsSync,readFileSync}=require('fs');
            for (const d of readdirSync('packages')) {
              const p='packages/'+d+'/package.json';
              if (!existsSync(p)) continue;
              const j=JSON.parse(readFileSync(p,'utf-8'));
              if (j.private !== true) console.log(j.name);
            }"); do
            if npm view "$DIR@$VERSION" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
              echo "  ok   $DIR@$VERSION"
            else
              echo "  MISSING  $DIR@$VERSION"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::Some packages did not publish at $VERSION — the release is incomplete."
            exit 1
          fi
